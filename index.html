<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="ard" href="/.well-known/ard.json" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Find trusted kitchen product reviews, buying guides, and practical recommendations for appliances, cookware, storage, and more." />
    <script>
      const categorySlug = window.location.pathname.match(/^\/category\/([a-z0-9-]+)\/?$/)?.[1];
      const heroImage = categorySlug
        ? `/categories/category-${categorySlug}.webp`
        : window.location.pathname === '/'
          ? '/homepage/hero-modern-kitchen.webp'
          : null;

      if (heroImage) {
        const heroPreload = document.createElement('link');
        heroPreload.rel = 'preload';
        heroPreload.as = 'image';
        heroPreload.fetchPriority = 'high';
        heroPreload.href = heroImage;
        document.head.append(heroPreload);
      }
    </script>
    <title>KitchenTrusted</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
